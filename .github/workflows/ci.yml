name: CI

on:
  push:
    branches: ["staging", "production", "main", "fix/platform-completion"]
  pull_request:

jobs:
  backend:
    name: Backend tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Prepare test environment
        run: |
          cp .env.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=test/' .env

      - name: Run unit tests with coverage
        # Scope to tests/unit: a bare `pytest` also collects src/**/test_*.py
        # files and integration tests that need a database.
        run: |
          pytest tests/unit -m "not integration and not rls" \
            --cov=src/app --cov-report=term-missing --cov-report=xml

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend tests + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-dashboard-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: nexus-dashboard-web/package-lock.json

      - name: Install dependencies
        # The app pulls React 19 against libraries that still declare React 18
        # peers, so a strict `npm ci` cannot reconcile the tree (and npm 10
        # crashes resolving it). The lock is generated with the same flag.
        run: npm ci --legacy-peer-deps

      - name: Run tests with coverage
        run: npm run coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: nexus-dashboard-web/coverage
          if-no-files-found: ignore
