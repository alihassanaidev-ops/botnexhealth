[pytest]
# Only collect the test tree. Without this a bare `pytest` also picks up
# src/**/test_*.py files (e.g. the Test Suite route) and errors at collection.
testpaths = tests
markers =
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    rls: marks tests as requiring a real PostgreSQL database with RLS enabled
pythonpath = src
