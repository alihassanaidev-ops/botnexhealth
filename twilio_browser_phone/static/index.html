<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Twilio Browser Phone QA</title>
    <script src="https://unpkg.com/@twilio/voice-sdk@2.12.3/dist/twilio.min.js"></script>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #101114;
        color: #f6f7fb;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(720px, calc(100vw - 32px));
        border: 1px solid #2a2d34;
        border-radius: 8px;
        padding: 24px;
        background: #17191f;
        box-shadow: 0 24px 80px rgb(0 0 0 / 35%);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        line-height: 1.2;
      }

      p {
        margin: 0 0 20px;
        color: #aab1c0;
      }

      .status {
        min-height: 22px;
        margin: 16px 0;
        color: #d5dae5;
      }

      .incoming {
        display: none;
        margin-top: 16px;
        padding: 16px;
        border: 1px solid #385f47;
        border-radius: 8px;
        background: #112016;
      }

      .incoming.visible {
        display: block;
      }

      button {
        border: 0;
        border-radius: 6px;
        padding: 12px 16px;
        color: #fff;
        background: #4f46e5;
        font-size: 15px;
        cursor: pointer;
      }

      button.secondary {
        background: #2d313a;
      }

      button.danger {
        background: #c2410c;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      label {
        display: grid;
        gap: 8px;
        margin: 16px 0 0;
        color: #d5dae5;
        font-size: 14px;
      }

      select {
        width: 100%;
        border: 1px solid #30343e;
        border-radius: 6px;
        padding: 10px 12px;
        background: #0f1116;
        color: #f6f7fb;
        font-size: 14px;
      }

      .debug {
        height: 180px;
        margin: 18px 0 0;
        padding: 12px;
        overflow: auto;
        border: 1px solid #2a2d34;
        border-radius: 8px;
        background: #0f1116;
        color: #b9c0ce;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
      }

      code {
        color: #c4b5fd;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Twilio Browser Phone QA</h1>
      <p>
        Register this tab as a Twilio Client. When Retell calls the Twilio number,
        this browser should ring.
      </p>

      <div class="row">
        <button id="register">Register browser phone</button>
        <button id="testAudio" class="secondary">Play test tone</button>
        <button id="unregister" class="secondary" disabled>Unregister</button>
      </div>

      <label>
        Speaker output
        <select id="speakerSelect">
          <option value="">Browser default</option>
        </select>
      </label>

      <div id="status" class="status">Not registered.</div>

      <section id="incoming" class="incoming">
        <p id="incomingText">Incoming call.</p>
        <div class="row">
          <button id="answer">Answer</button>
          <button id="reject" class="danger">Reject</button>
        </div>
      </section>

      <pre id="debugLog" class="debug">Debug log will appear here.</pre>
    </main>

    <script>
      const statusEl = document.getElementById("status");
      const incomingEl = document.getElementById("incoming");
      const incomingText = document.getElementById("incomingText");
      const registerBtn = document.getElementById("register");
      const testAudioBtn = document.getElementById("testAudio");
      const unregisterBtn = document.getElementById("unregister");
      const answerBtn = document.getElementById("answer");
      const rejectBtn = document.getElementById("reject");
      const speakerSelect = document.getElementById("speakerSelect");
      const debugLogEl = document.getElementById("debugLog");

      let device = null;
      let activeCall = null;
      let localMicStream = null;
      let rtcConfiguration = null;

      function setStatus(message) {
        statusEl.textContent = message;
        log(message);
      }

      function log(message, data) {
        const timestamp = new Date().toLocaleTimeString();
        const line = data
          ? `[${timestamp}] ${message} ${JSON.stringify(data)}`
          : `[${timestamp}] ${message}`;
        if (debugLogEl.textContent === "Debug log will appear here.") {
          debugLogEl.textContent = line;
        } else {
          debugLogEl.textContent += `\n${line}`;
        }
        debugLogEl.scrollTop = debugLogEl.scrollHeight;
      }

      function hideIncoming() {
        incomingEl.classList.remove("visible");
        activeCall = null;
      }

      async function updateSpeakerOptions() {
        const devices = await navigator.mediaDevices?.enumerateDevices?.();
        const outputs = (devices || []).filter((item) => item.kind === "audiooutput");
        speakerSelect.innerHTML = '<option value="">Browser default</option>';

        outputs.forEach((item, index) => {
          const option = document.createElement("option");
          option.value = item.deviceId;
          option.textContent = item.label || `Speaker ${index + 1}`;
          speakerSelect.appendChild(option);
        });

        log("Browser output devices.", {
          count: outputs.length,
          ids: outputs.map((item) => item.deviceId || "(empty)"),
          labels: outputs.map((item) => item.label || "(unlabeled)"),
        });
      }

      async function applySpeakerSelection() {
        if (!device?.audio?.speakerDevices?.set) return;
        const selected = speakerSelect.value;
        if (!selected) {
          log("Using browser default speaker output.");
          return;
        }

        try {
          await device.audio.speakerDevices.set(selected);
          log("Twilio speaker output selected.", { deviceId: selected });
        } catch (error) {
          log("Could not set selected Twilio speaker output.", { message: error.message });
        }
      }

      async function requestMicPermission() {
        if (!navigator.mediaDevices?.getUserMedia) {
          log("Browser does not expose navigator.mediaDevices.getUserMedia.");
          return;
        }

        localMicStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        log("Microphone permission granted.");
        await updateSpeakerOptions();
      }

      function releaseMicPermissionProbe() {
        if (!localMicStream) return;
        localMicStream.getTracks().forEach((track) => track.stop());
        localMicStream = null;
      }

      async function playTestTone() {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) {
          setStatus("AudioContext is not supported in this browser.");
          return;
        }

        const context = new AudioContextClass();
        await context.resume();
        const oscillator = context.createOscillator();
        const gain = context.createGain();
        oscillator.frequency.value = 660;
        gain.gain.setValueAtTime(0.001, context.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.2, context.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, context.currentTime + 0.45);
        oscillator.connect(gain);
        gain.connect(context.destination);
        oscillator.start();
        oscillator.stop(context.currentTime + 0.5);
        setStatus("Played browser test tone.");
        window.setTimeout(() => context.close(), 700);
      }

      function wireCallEvents(call) {
        call.on("accept", () => {
          setStatus("Call accepted. Audio should be live now.");
        });
        call.on("disconnect", () => {
          setStatus("Call ended.");
          hideIncoming();
        });
        call.on("cancel", () => {
          setStatus("Incoming call cancelled.");
          hideIncoming();
        });
        call.on("reject", () => {
          setStatus("Incoming call rejected.");
          hideIncoming();
        });
        call.on("error", (error) => {
          console.error(error);
          setStatus(`Call error: ${error.message}`);
        });
        call.on("warning", (name, data) => {
          log(`Call warning: ${name}`, data || {});
        });
        call.on("warning-cleared", (name) => {
          log(`Call warning cleared: ${name}`);
        });
        call.on("reconnecting", (error) => {
          log("Call reconnecting.", { message: error?.message });
        });
        call.on("reconnected", () => {
          log("Call reconnected.");
        });
      }

      async function register() {
        registerBtn.disabled = true;
        setStatus("Requesting microphone and Twilio token...");
        await requestMicPermission();
        releaseMicPermissionProbe();

        const response = await fetch("/token");
        if (!response.ok) {
          throw new Error(await response.text());
        }
        const { token, identity } = await response.json();
        log("Received Twilio access token.", { identity });

        const iceResponse = await fetch("/ice-servers");
        if (iceResponse.ok) {
          const { iceServers } = await iceResponse.json();
          rtcConfiguration = { iceServers };
          log("Received Twilio ICE servers.", { count: iceServers?.length || 0 });
        } else {
          log("Could not load Twilio ICE servers.", { status: iceResponse.status });
        }

        const VoiceDevice = window.Twilio?.Device || window.TwilioVoice?.Device;
        if (!VoiceDevice) {
          throw new Error("Twilio Voice SDK did not load. Refresh the page or check network access.");
        }
        log("Twilio Voice SDK loaded.");

        device = new VoiceDevice(token, {
          edge: ["singapore", "ashburn"],
          codecPreferences: ["opus", "pcmu"],
          logLevel: 1,
        });
        log("Twilio device created.", { edge: ["singapore", "ashburn"] });

        if (device.audio) {
          log("Twilio audio support.", {
            outputSelection: Boolean(device.audio.isOutputSelectionSupported),
            volume: Boolean(device.audio.isVolumeSupported),
          });
          device.audio.on("deviceChange", async () => {
            log("Twilio audio deviceChange event.");
            await updateSpeakerOptions();
            await applySpeakerSelection();
          });
          await applySpeakerSelection();
        }

        device.on("registered", () => {
          setStatus(`Registered as ${identity}. Keep this tab open.`);
          unregisterBtn.disabled = false;
        });

        device.on("unregistered", () => {
          setStatus("Not registered.");
          unregisterBtn.disabled = true;
          registerBtn.disabled = false;
        });

        device.on("incoming", (call) => {
          activeCall = call;
          incomingText.textContent = "Incoming call from Twilio.";
          incomingEl.classList.add("visible");
          log("Incoming call received.", call.parameters || {});
          wireCallEvents(call);
        });

        device.on("error", (error) => {
          console.error(error);
          setStatus(`Twilio error: ${error.message}`);
          registerBtn.disabled = false;
        });

        device.on("tokenWillExpire", () => {
          log("Twilio token will expire soon; refresh/register again if testing longer.");
        });

        await device.register();
      }

      registerBtn.addEventListener("click", async () => {
        try {
          await register();
        } catch (error) {
          console.error(error);
          setStatus(`Failed to register: ${error.message}`);
          registerBtn.disabled = false;
        }
      });

      testAudioBtn.addEventListener("click", async () => {
        try {
          await playTestTone();
          await applySpeakerSelection();
          if (device?.audio?.speakerDevices?.test) {
            await device.audio.speakerDevices.test();
            log("Twilio speaker device test completed.");
          }
        } catch (error) {
          console.error(error);
          setStatus(`Failed to play test tone: ${error.message}`);
        }
      });

      unregisterBtn.addEventListener("click", async () => {
        if (device) {
          await device.unregister();
          device.destroy();
          device = null;
        }
      });

      answerBtn.addEventListener("click", () => {
        if (!activeCall) return;
        log("Answer clicked.");
        activeCall.accept(rtcConfiguration ? { rtcConfiguration } : undefined);
        setStatus("Connecting call...");
      });

      rejectBtn.addEventListener("click", () => {
        if (!activeCall) return;
        log("Reject clicked.");
        activeCall.reject();
        hideIncoming();
        setStatus("Call rejected.");
      });

      speakerSelect.addEventListener("change", async () => {
        await applySpeakerSelection();
      });
    </script>
  </body>
</html>
